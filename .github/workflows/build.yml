name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build mod
        run: dotnet build ArabicTranslation.sln -c Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build installer
        run: |
          pip install -r installer/requirements.txt
          python installer/build_installer.py

      - name: Show checksums
        run: type installer\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OWArabicTranslation-${{ github.sha }}
          path: |
            installer/dist/OWArabicTranslation_Installer.exe
            installer/dist/arabic.OWArabicTranslation.zip
            installer/dist/SHA256SUMS.txt

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          {
            echo "Built by GitHub Actions from commit \`${GITHUB_SHA}\` in [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            echo "## Install"
            echo
            echo "- **One click:** download \`OWArabicTranslation_Installer.exe\` and run it."
            echo "- **Manual, no exe:** download \`arabic.OWArabicTranslation.zip\` and add it in the Outer Wilds Mod Manager with *Install from zip*. Needs Interplanetary Polyglot. See [docs/manual-install.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/manual-install.md)."
            echo
            echo "## SHA-256"
            echo
            echo '```'
            cat installer/dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Full details in [CHANGELOG.md](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
          } > installer/dist/RELEASE_NOTES.md
          cat installer/dist/RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: installer/dist/RELEASE_NOTES.md
          files: |
            installer/dist/OWArabicTranslation_Installer.exe
            installer/dist/arabic.OWArabicTranslation.zip
            installer/dist/SHA256SUMS.txt
