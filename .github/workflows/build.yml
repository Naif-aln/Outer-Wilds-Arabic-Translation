name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build mod
        run: dotnet build ArabicTranslation.sln -c Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build installer
        run: |
          pip install -r installer/requirements.txt
          python installer/build_installer.py

      - name: Show checksums
        run: type installer\dist\SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OWArabicTranslation-${{ github.sha }}
          path: |
            installer/dist/OWArabicTranslation_Installer.exe
            installer/dist/arabic.OWArabicTranslation.zip
            installer/dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            installer/dist/OWArabicTranslation_Installer.exe
            installer/dist/arabic.OWArabicTranslation.zip
            installer/dist/SHA256SUMS.txt
